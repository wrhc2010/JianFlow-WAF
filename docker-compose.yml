services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jevwaf
      POSTGRES_USER: jevwaf
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - jevwaf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jevwaf -d jevwaf"]
      interval: 5s
      timeout: 3s
      retries: 10
    secrets:
      - postgres_password

  api:
    image: ghcr.io/wrhc2010/jianflow-waf-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 8080
      SITE_PORT_RANGE: ${SITE_PORT_RANGE:-8080-8099}
      HTTPS_PORT: 8443
      TLS_KEY_PATH: ""
      TLS_CERT_PATH: ""
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: jevwaf
      POSTGRES_DB: jevwaf
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://openrouter.ai}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://host.docker.internal:9000}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-2000}
      AI_BODY_LIMIT: ${AI_BODY_LIMIT:-32768}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-10485760}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      MAX_PROXY_CONCURRENT: ${MAX_PROXY_CONCURRENT:-200}
      MAX_TRACKED_CLIENTS: ${MAX_TRACKED_CLIENTS:-10000}
      AI_MAX_CONCURRENT: ${AI_MAX_CONCURRENT:-8}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-120}
      EVENT_QUEUE_LIMIT: ${EVENT_QUEUE_LIMIT:-2000}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-false}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-local}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_TIMEOUT_MS: ${CAPTCHA_TIMEOUT_MS:-5000}
      CAPTCHA_FAILURE_ACTION: ${CAPTCHA_FAILURE_ACTION:-block}
      DATA_DIR: /app/data
      JIANFLOW_CONFIG_FILE: ${JIANFLOW_CONFIG_FILE:-}
      JIANFLOW_PAGES_DIR: /app/pages
      GEOIP_DATABASE_PATH: ${GEOIP_DATABASE_PATH:-/app/geoip/GeoLite2-City.mmdb}
      GEOIP_ASN_DATABASE_PATH: ${GEOIP_ASN_DATABASE_PATH:-/app/geoip/GeoLite2-ASN.mmdb}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.29.83.2/32}
    secrets:
      - postgres_password
    expose:
      - "4000"
      - "${SITE_PORT_RANGE:-8080-8099}"
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/app/certs:ro
      - jevwaf-data:/app/data
      - ${GEOIP_DIR:-./geoip}:/app/geoip:ro
      - ${CONFIG_DIR:-./config}:/app/config:ro
      - ${PAGES_DIR:-./pages}:/app/pages:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default: {}
      gateway:
        ipv4_address: ${API_GATEWAY_IP:-172.29.83.3}

  web:
    image: ghcr.io/wrhc2010/jianflow-waf-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
      - "${SITE_PORT_RANGE:-8080-8099}:${SITE_PORT_RANGE:-8080-8099}"
      - "8443:8443"
    environment:
      SITE_PORT_RANGE: ${SITE_PORT_RANGE:-8080-8099}
      GATEWAY_TLS_CERT: ${TLS_CERT_PATH:-}
      GATEWAY_TLS_KEY: ${TLS_KEY_PATH:-}
    volumes:
      - ${TLS_CERT_DIR:-./certs}:/app/certs:ro
    networks:
      gateway:
        ipv4_address: ${GATEWAY_IP:-172.29.83.2}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jevwaf-postgres:
  jevwaf-data:

networks:
  gateway:
    ipam:
      config:
        - subnet: ${GATEWAY_SUBNET:-172.29.83.0/24}

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_SOURCE:-./secrets/postgres_password}
